name: Validate feature changes

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/ai-chat-automation

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Type check
        run: bunx tsc --noEmit
      - name: Build application
        run: |
          bun run build
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
