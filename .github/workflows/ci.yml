name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/instagram-oauth-mcp", "feature/ai-chat-automation"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build and verify Cloudflare output
        run: |
          bun run build
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
