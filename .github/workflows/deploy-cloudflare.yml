name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: instagram-insight-harbor-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Build Cloudflare Worker
        run: |
          bun run build
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json
      - name: Persist production Worker variables in deploy config
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.vars = {
            ...(config.vars ?? {}),
            META_APP_ID: "1757933928640562",
            META_REDIRECT_URI: "https://instagram-insight-harbor.ghostempire1m.workers.dev/api/public/meta/callback",
            SUPABASE_URL: "https://hkxriebexkuupdfktlga.supabase.co",
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          console.log("Persisted 3 non-secret production Worker variables in generated deploy config.");
          NODE
      - name: Deploy
        run: bunx nitro deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
